version: '3.9'

services:
  redis:
    image: redis:7-alpine
    container_name: hms-redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data
    networks:
      - hms-network

  postgres:
    image: postgres:15-alpine
    container_name: hms-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hms}
      POSTGRES_USER: ${POSTGRES_USER:-hms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hms_password}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hms}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hms-network

  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hms-django
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-here}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${POSTGRES_DB:-hms}
      DB_USER: ${POSTGRES_USER:-hms}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-hms_password}
      DB_HOST: postgres
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-True}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-admin123}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - static_volume:/app/HMS/static
      - media_volume:/app/HMS/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - hms-network

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hms-celery
    depends_on:
      - redis
      - postgres
      - django
    env_file:
      - .env
    environment:
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-here}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${POSTGRES_DB:-hms}
      DB_USER: ${POSTGRES_USER:-hms}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-hms_password}
      DB_HOST: postgres
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-False}
    volumes:
      - .:/app
    command: celery -A HMS worker -l info
    networks:
      - hms-network

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hms-celery-beat
    depends_on:
      - redis
      - postgres
      - django
    env_file:
      - .env
    environment:
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-here}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${POSTGRES_DB:-hms}
      DB_USER: ${POSTGRES_USER:-hms}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-hms_password}
      DB_HOST: postgres
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - .:/app
    command: celery -A HMS beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    networks:
      - hms-network

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  hms-network:
    driver: bridge
