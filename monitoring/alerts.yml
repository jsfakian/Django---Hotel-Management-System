groups:
  - name: Django Application Alerts
    interval: 30s
    rules:
      # High HTTP Error Rate
      - alert: HighHTTPErrorRate
        expr: |
          (sum(rate(django_http_requests_total{status=~"5.."}[5m])) by (job) / 
           sum(rate(django_http_requests_total[5m])) by (job)) > 0.05
        for: 5m
        labels:
          severity: critical
          service: django
        annotations:
          summary: "High HTTP Error Rate on {{ $labels.job }}"
          description: "{{ $labels.job }} has error rate of {{ $value | humanizePercentage }} over 5m"

      # High HTTP Request Latency
      - alert: HighHTTPLatency
        expr: |
          (histogram_quantile(0.95, sum(rate(django_http_requests_latency_seconds_bucket[5m])) by (le, job))) > 1
        for: 5m
        labels:
          severity: warning
          service: django
        annotations:
          summary: "High HTTP Latency on {{ $labels.job }}"
          description: "p95 latency is {{ $value | humanizeDuration }}"

      # Django ORM Database Queries - High Count
      - alert: HighDatabaseQueryCount
        expr: |
          rate(django_db_execute_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
          service: django
        annotations:
          summary: "High Database Query Rate on {{ $labels.job }}"
          description: "Database query rate is {{ $value | humanize }} qps"

      # Model Save/Delete Operations High
      - alert: HighModelOperationRate
        expr: |
          (rate(django_model_inserts_total[5m]) + rate(django_model_updates_total[5m]) + rate(django_model_deletes_total[5m])) > 50
        for: 5m
        labels:
          severity: info
          service: django
        annotations:
          summary: "High Model Operation Rate on {{ $labels.job }}"
          description: "Model operations rate is {{ $value | humanize }} ops/s"

  - name: Database Alerts
    interval: 30s
    rules:
      # PostgreSQL Connection Pool Exhaustion
      - alert: PostgreSQLConnectionPoolAlmostFull
        expr: |
          (pg_stat_activity_count / pg_settings_max_connections) > 0.8
        for: 5m
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: "PostgreSQL Connection Pool Almost Full on {{ $labels.instance }}"
          description: "Connection usage is at {{ $value | humanizePercentage }}"

      # PostgreSQL High Transaction Rate
      - alert: PostgreSQLHighTransactionRate
        expr: |
          rate(pg_stat_database_xact_commit[5m]) > 1000
        for: 5m
        labels:
          severity: info
          service: postgres
        annotations:
          summary: "High Transaction Rate on {{ $labels.instance }}"
          description: "Transaction rate is {{ $value | humanize }} tps"

      # PostgreSQL Slow Queries
      - alert: PostgreSQLSlowQueries
        expr: |
          rate(pg_slow_queries[5m]) > 0
        for: 5m
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: "Slow Queries Detected on {{ $labels.instance }}"
          description: "Slow query rate is {{ $value | humanize }} per second"

      # PostgreSQL Cache Hit Ratio Low
      - alert: PostgreSQLLowCacheHitRatio
        expr: |
          (rate(pg_stat_database_heap_blks_hit[5m]) / (rate(pg_stat_database_heap_blks_hit[5m]) + rate(pg_stat_database_heap_blks_read[5m]))) < 0.95
        for: 10m
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: "Low Cache Hit Ratio on {{ $labels.instance }}"
          description: "Cache hit ratio is {{ $value | humanizePercentage }}"

  - name: Redis Alerts
    interval: 30s
    rules:
      # Redis Memory Usage High
      - alert: RedisMemoryUsageHigh
        expr: |
          (redis_memory_used_bytes / redis_memory_max_bytes) > 0.8
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "High Memory Usage on Redis {{ $labels.instance }}"
          description: "Memory usage is at {{ $value | humanizePercentage }}"

      # Redis Connected Clients High
      - alert: RedisConnectedClientsHigh
        expr: |
          redis_connected_clients > 50
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "High Number of Connected Clients to Redis {{ $labels.instance }}"
          description: "Connected clients: {{ $value | humanize }}"

      # Redis Evictions High
      - alert: RedisEvictionsHigh
        expr: |
          rate(redis_evicted_keys_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Redis Keys Being Evicted on {{ $labels.instance }}"
          description: "Eviction rate is {{ $value | humanize }} per second"

      # Redis Replication Lag High
      - alert: RedisReplicationLagHigh
        expr: |
          redis_replication_backlog_size > 100000
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "High Replication Lag on Redis {{ $labels.instance }}"
          description: "Replication lag is {{ $value | humanize }} bytes"

  - name: Celery Alerts
    interval: 30s
    rules:
      # Celery Task Queue Length High
      - alert: CeleryQueueLengthHigh
        expr: |
          celery_queue_length > 1000
        for: 5m
        labels:
          severity: warning
          service: celery
        annotations:
          summary: "High Task Queue Length on {{ $labels.queue }}"
          description: "Queue length is {{ $value | humanize }} tasks"

      # Celery Task Failure Rate High
      - alert: CeleryTaskFailureRateHigh
        expr: |
          (rate(celery_task_failed_total[5m]) / rate(celery_task_total[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
          service: celery
        annotations:
          summary: "High Task Failure Rate on {{ $labels.job }}"
          description: "Failure rate is {{ $value | humanizePercentage }}"

      # Celery Worker Offline
      - alert: CeleryWorkerOffline
        expr: |
          celery_worker_up == 0
        for: 1m
        labels:
          severity: critical
          service: celery
        annotations:
          summary: "Celery Worker Offline: {{ $labels.worker }}"
          description: "Celery worker {{ $labels.worker }} has been offline for more than 1 minute"

      # Celery Task Execution Time High
      - alert: CeleryHighTaskExecutionTime
        expr: |
          celery_task_runtime_seconds > 300
        for: 5m
        labels:
          severity: warning
          service: celery
        annotations:
          summary: "High Task Execution Time on {{ $labels.task_name }}"
          description: "Execution time is {{ $value | humanizeDuration }}"

  - name: System Alerts
    interval: 30s
    rules:
      # High CPU Usage
      - alert: HighCPUUsage
        expr: |
          (100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 80
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High CPU Usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value | humanize }}%"

      # High Memory Usage
      - alert: HighMemoryUsage
        expr: |
          ((node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes) > 0.85
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High Memory Usage on {{ $labels.instance }}"
          description: "Memory usage is at {{ $value | humanizePercentage }}"

      # Disk Space Running Out
      - alert: DiskSpaceRunningOut
        expr: |
          ((node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lowerfs|squashfs|vfat"} / node_filesystem_size_bytes{fstype!~"tmpfs|fuse.lowerfs|squashfs|vfat"}) * 100) < 10
        for: 5m
        labels:
          severity: critical
          service: system
        annotations:
          summary: "Low Disk Space on {{ $labels.instance }} at {{ $labels.device }}"
          description: "Available space is {{ $value | humanize }}%"

      # High I/O Wait
      - alert: HighIOWait
        expr: |
          (avg by (instance) (rate(node_cpu_seconds_total{mode="iowait"}[5m])) * 100) > 20
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High I/O Wait on {{ $labels.instance }}"
          description: "I/O wait is {{ $value | humanize }}%"

      # Host Down
      - alert: NodeDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
          service: system
        annotations:
          summary: "Node {{ $labels.instance }} is down"
          description: "Node {{ $labels.instance }} ({{ $labels.job }}) has been down for more than 2 minutes"

  - name: Application Availability Alerts
    interval: 30s
    rules:
      # Application Uptime Check
      - alert: DjangoApplicationDown
        expr: |
          up{job="django"} == 0
        for: 1m
        labels:
          severity: critical
          service: django
        annotations:
          summary: "Django Application is Down"
          description: "Django application has been unreachable for more than 1 minute"

      # Hotel Service Health Check
      - alert: HotelServiceHealthCheckFailed
        expr: |
          http_requests_total{endpoint="/health/",status=~"5.."}[-1m] > 0
        for: 2m
        labels:
          severity: critical
          service: health
        annotations:
          summary: "Hotel Service Health Check Failed"
          description: "Continuous health check failures detected"

      # High Response Time on Critical Endpoints
      - alert: CriticalEndpointSlowResponse
        expr: |
          histogram_quantile(0.95, sum(rate(django_http_requests_latency_seconds_bucket{endpoint=~"/api/.*"}[5m])) by (le, endpoint)) > 2
        for: 5m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "Slow Response Time on API Endpoint {{ $labels.endpoint }}"
          description: "p95 response time is {{ $value | humanizeDuration }}"
