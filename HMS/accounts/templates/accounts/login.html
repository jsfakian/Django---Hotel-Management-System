{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <title>Login | NEPHELE HMS</title>
    <link rel="icon" type="image/svg+xml" href="{% static '/images/favicon.svg' %}">
    <link rel="stylesheet" type="text/css" href="{% static '/css/main.css' %}">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
        integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
        integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
        integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
        crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"
        integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.1/css/all.css"
        integrity="sha384-gfdkjb5BdAXd+lj+gudLWI+BXq4IuLW5IT+brZEZsLFm++aCMlF1V92rMkPaX4PP" crossorigin="anonymous">

</head>

<body class="bg-hotel">
    <div class="page-shell" style="background: transparent;">
        <div class="card auth-card p-4">
            <div class="text-center mb-4">
                <img src="{% static '/images/nephele-logo.svg' %}" alt="NEPHELE Logo" class="mb-2" style="height: 36px; width: auto;">
                <h3 class="mb-1">NEPHELE HMS</h3>
                <p class="text-muted mb-0">Sign in to continue</p>
            </div>

            {% for message in messages %}
            <div class="alert alert-warning" role="alert">{{message}}</div>
            {% endfor %}

            <form method="POST" action="">
                {% csrf_token %}
                <div class="form-group">
                    <label for="username">Username</label>
                    <input id="username" type="text" name="username" placeholder="Enter username" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" type="password" name="password" placeholder="Enter password" class="form-control" required>
                </div>
                <button class="btn btn-dark btn-block" type="submit">Login</button>
            </form>

            <div class="mt-3 text-center">
                <small class="text-muted">Need an account? <a href="{% url 'register' %}">Register</a></small>
            </div>
        </div>
    </div>
</body>

</html>
