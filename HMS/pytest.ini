[pytest]
# pytest configuration for HMS test suite

DJANGO_SETTINGS_MODULE = HMS.test_settings
python_files = tests.py test_*.py *_tests.py
testpaths = tests
addopts = 
    --ds=HMS.test_settings
    --strict-markers
    --tb=short
    --disable-warnings
    -v

# Markers for test organization
markers =
    unit: Unit tests (models, serializers)
    integration: Integration tests (workflows)
    e2e: End-to-end tests (user journeys)
    performance: Performance and load tests
    slow: Tests that take significant time to run
    django_db: Tests that require database access
    functional: Functional browser tests

# Coverage options
[coverage:run]
source = .
omit =
    */tests/*
    */migrations/*
    */venv/*
    */virtualenv/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

precision = 2
