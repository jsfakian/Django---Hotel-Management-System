{% extends '../index.html' %}
{% block context %}

<script src="https://js.stripe.com/v3/"></script>

<style>
    .StripeElement {
        box-sizing: border-box;
        height: 40px;
        padding: 10px 12px;
        border: 1px solid #ced4da;
        border-radius: 4px;
        background-color: white;
        transition: box-shadow 150ms ease;
    }
    .StripeElement--focus {
        border-color: #80bdff;
        outline: 0;
        box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
    }
    .StripeElement--invalid {
        border-color: #dc3545;
    }
    .stripe-error {
        color: #dc3545;
        font-size: 0.875rem;
        margin-top: 0.25rem;
    }
</style>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-xs-12 col-md-6">
            <div class="card">
                <div class="card-header">
                    <h3 class="mb-0" id="payment-heading">Payment Details</h3>
                </div>
                <div class="card-body">

                    <div id="payment-form-errors" role="alert" aria-live="assertive" aria-atomic="true"></div>

                    <form id="payment-form" action="{% url 'verify' %}" method="POST"
                          aria-labelledby="payment-heading" novalidate>
                        {% csrf_token %}

                        <fieldset>
                            <legend class="sr-only">Card details</legend>

                            <div class="form-group">
                                <label id="card-element-label">
                                    Card Details
                                    <span class="text-danger" aria-hidden="true">*</span>
                                </label>
                                <div id="card-element"
                                     role="group"
                                     aria-labelledby="card-element-label"
                                     aria-describedby="card-element-errors card-element-hint">
                                </div>
                                <small id="card-element-hint" class="form-text text-muted">
                                    Card number, expiry date, and CVC — secured by Stripe.
                                </small>
                                <div id="card-element-errors"
                                     class="stripe-error"
                                     role="alert"
                                     aria-live="assertive"
                                     aria-atomic="true"></div>
                            </div>

                        </fieldset>

                        <input type="hidden" id="stripe-payment-method" name="stripe_payment_method">
                        <input type="hidden" value="{{ code }}" name="tempCode">

                        <button id="pay-button" type="submit" class="btn btn-success btn-lg btn-block"
                                aria-describedby="card-element-errors">
                            Pay
                        </button>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
(function () {
    var stripeKey = "{{ stripe_public_key|escapejs }}";
    if (!stripeKey) { return; }

    var stripe = Stripe(stripeKey);
    var elements = stripe.elements();

    var card = elements.create('card', {
        hidePostalCode: true,
        style: {
            base: {
                fontSize: '16px',
                color: '#495057',
                fontFamily: 'inherit',
                '::placeholder': { color: '#6c757d' }
            },
            invalid: {
                color: '#dc3545',
                iconColor: '#dc3545'
            }
        }
    });
    card.mount('#card-element');

    card.on('change', function (event) {
        var errorEl = document.getElementById('card-element-errors');
        if (event.error) {
            errorEl.textContent = event.error.message;
        } else {
            errorEl.textContent = '';
        }
    });

    document.getElementById('payment-form').addEventListener('submit', function (e) {
        e.preventDefault();
        var btn = document.getElementById('pay-button');
        btn.disabled = true;
        btn.textContent = 'Processing…';

        stripe.createPaymentMethod({ type: 'card', card: card }).then(function (result) {
            if (result.error) {
                var errorEl = document.getElementById('card-element-errors');
                errorEl.textContent = result.error.message;
                btn.disabled = false;
                btn.textContent = 'Pay';
                errorEl.focus();
            } else {
                document.getElementById('stripe-payment-method').value = result.paymentMethod.id;
                document.getElementById('payment-form').submit();
            }
        });
    });
}());
</script>

{% endblock %}
