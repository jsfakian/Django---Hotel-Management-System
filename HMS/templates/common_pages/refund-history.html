{% extends '../index.html' %}

{% block context %}
<div class="container py-4">
    <h3 class="mb-3">Refund History</h3>

    <form class="card card-body mb-3" method="get">
        <div class="form-row align-items-end">
            <div class="col-md-4">
                <label>Status</label>
                <select name="status" class="form-control">
                    <option value="">All</option>
                    {% for key, label in status_choices %}
                    <option value="{{ key }}" {% if selected_status == key %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-2"><button class="btn btn-outline-dark btn-block" type="submit">Apply</button></div>
        </div>
    </form>

    <div class="card">
        <div class="table-responsive">
            <table class="table mb-0">
                <thead class="thead-light"><tr><th>ID</th><th>Amount</th><th>Reason</th><th>Status</th><th>Date</th></tr></thead>
                <tbody>
                    {% for r in refunds %}
                    <tr>
                        <td>#{{ r.id }}</td>
                        <td>{{ r.refund_amount }}</td>
                        <td>{{ r.get_reason_display }}</td>
                        <td>{{ r.get_status_display }}</td>
                        <td>{{ r.requested_at }}</td>
                    </tr>
                    {% empty %}
                    <tr><td colspan="5" class="text-center text-muted py-4">No refund requests found.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
