{% extends '../index.html' %}

{% block context %}
<div class="container py-4">
    <h3 class="mb-3">Verify Payment</h3>
    <div class="card">
        <div class="card-body">
            <p class="text-muted">Reference: {{ payment.reference_code }}</p>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn-dark" type="submit">Verify</button>
                <a class="btn btn-outline-secondary" href="{% url 'payment-history' %}">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
