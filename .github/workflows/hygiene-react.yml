name: React Hygiene

on:
  push:
    branches: [ main, develop, nephele ]
    paths:
      - 'frontend/**'
      - 'scripts/hygiene-react.sh'
      - '.github/workflows/hygiene-react.yml'
  pull_request:
    branches: [ main, develop, nephele ]
    paths:
      - 'frontend/**'
      - 'scripts/hygiene-react.sh'
      - '.github/workflows/hygiene-react.yml'
  workflow_dispatch:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run React hygiene
        working-directory: .
        run: bash scripts/hygiene-react.sh
