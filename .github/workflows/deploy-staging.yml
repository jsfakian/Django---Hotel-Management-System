name: Deploy to Staging

on:
  push:
    branches: [ develop, staging, nephele ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # Test Job: Run tests before deploying
  # ============================================================================
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_hms
          POSTGRES_USER: hms
          POSTGRES_PASSWORD: hms_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.14'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-ci.txt
        pip install -r nephele/requirements-test.txt

    - name: Run Django checks
      env:
        DJANGO_SETTINGS_MODULE: config.test_settings
        SECRET_KEY: test-secret-key
        DEBUG: 'True'
      run: |
        cd nephele
        python manage.py check

    - name: Run tests
      env:
        DJANGO_SETTINGS_MODULE: config.test_settings
        SECRET_KEY: test-secret-key
        DEBUG: 'True'
      run: |
        cd nephele
        pytest -m "not e2e" --cov=. --cov-report=xml -v

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./nephele/coverage.xml

  # ============================================================================
  # Security Scan Job: Check for vulnerabilities
  # ============================================================================
  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.14'

    - name: Install security tools
      run: |
        pip install bandit safety semgrep

    - name: Run Bandit security scan
      run: |
        bandit -r nephele -f json -o bandit-report.json || true
        cat bandit-report.json

    - name: Check dependencies for vulnerabilities
      run: |
        pip install -r requirements.txt
        safety check --json || true

    - name: Run Semgrep security checks
      run: |
        semgrep --config=p/security-audit nephele/ --json > semgrep-report.json || true

  # ============================================================================
  # Build Job: Build Docker images
  # ============================================================================
  build:
    needs: [test, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile.prod
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ============================================================================
  # Deploy Job: Deploy to staging environment
  # ============================================================================
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Push and manual "Run workflow" both reach this job (build already gated on test+security).
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: staging
      url: https://centaur.med.uoc.gr

    steps:
    - uses: actions/checkout@v3

    - name: Check staging deploy secrets
      id: secrets
      env:
        DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
        DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
        DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
      run: |
        missing=()
        [ -n "$DEPLOY_KEY" ] || missing+=(STAGING_DEPLOY_KEY)
        [ -n "$DEPLOY_HOST" ] || missing+=(STAGING_DEPLOY_HOST)
        [ -n "$DEPLOY_USER" ] || missing+=(STAGING_DEPLOY_USER)
        [ -n "$DEPLOY_PATH" ] || missing+=(STAGING_DEPLOY_PATH)
        if [ "${#missing[@]}" -gt 0 ]; then
          echo "configured=false" >> "$GITHUB_OUTPUT"
          {
            echo "### Staging deploy skipped"
            echo "Missing GitHub Actions secrets: \`${missing[*]}\`"
            echo ""
            echo "Add them under **Settings → Secrets and variables → Actions**, then re-run."
            echo ""
            echo "SSH on centaur uses port **58889** (set \`STAGING_DEPLOY_PORT\` or rely on the workflow default)."
            echo "Suggested values:"
            echo "- \`STAGING_DEPLOY_HOST\` = \`centaur.med.uoc.gr\`"
            echo "- \`STAGING_DEPLOY_PORT\` = \`58889\`"
            echo "- \`STAGING_DEPLOY_USER\` = SSH user on the host"
            echo "- \`STAGING_DEPLOY_PATH\` = repo path on the host"
            echo "- \`STAGING_DEPLOY_KEY\` = private key authorized for that user"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Staging deploy skipped — missing secrets: ${missing[*]}"
        else
          echo "configured=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Deploy to staging server
      if: steps.secrets.outputs.configured == 'true'
      env:
        DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
        DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
        DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
        DEPLOY_PORT: ${{ secrets.STAGING_DEPLOY_PORT }}
        DEPLOY_BRANCH: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        PORT="${DEPLOY_PORT:-58889}"
        mkdir -p ~/.ssh
        printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

        ssh -i ~/.ssh/deploy_key -p "$PORT" -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
          "DEPLOY_PATH=$(printf %q "$DEPLOY_PATH") DEPLOY_BRANCH=$(printf %q "$DEPLOY_BRANCH") bash -s" << 'EOF'
        set -euo pipefail
        cd "$DEPLOY_PATH"
        git fetch --all --prune
        git checkout "$DEPLOY_BRANCH"
        if git show-ref --verify --quiet "refs/remotes/jsfakian/$DEPLOY_BRANCH"; then
          git reset --hard "jsfakian/$DEPLOY_BRANCH"
        elif git rev-parse --verify --quiet "@{u}" >/dev/null; then
          git reset --hard "@{u}"
        else
          git pull --ff-only origin "$DEPLOY_BRANCH"
        fi
        # Local image name (hms-django-prod) is not on a registry — build from checkout.
        docker compose -f docker-compose.prod.yml --env-file .env.prod -p nephele build django
        docker compose -f docker-compose.prod.yml --env-file .env.prod -p nephele up -d
        docker compose -f docker-compose.prod.yml --env-file .env.prod -p nephele exec -T django python manage.py migrate
        docker compose -f docker-compose.prod.yml --env-file .env.prod -p nephele exec -T django python manage.py collectstatic --noinput
        EOF

    - name: Run health checks
      if: steps.secrets.outputs.configured == 'true'
      env:
        DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
        STAGING_HEALTH_URL: ${{ secrets.STAGING_HEALTH_URL }}
      run: |
        set -euo pipefail
        HEALTH_URL="${STAGING_HEALTH_URL:-https://${DEPLOY_HOST}/health/}"
        echo "Checking $HEALTH_URL"
        sleep 20
        for i in {1..8}; do
          if curl -skf "$HEALTH_URL" > /dev/null; then
            echo "✓ Health check passed"
            exit 0
          fi
          echo "Health check attempt $i/8..."
          sleep 10
        done
        echo "✗ Health check failed for $HEALTH_URL"
        exit 1

    - name: Notify deployment
      if: success() && steps.secrets.outputs.configured == 'true'
      run: echo "Deployment to staging successful!"

    - name: Notify deployment skipped
      if: success() && steps.secrets.outputs.configured != 'true'
      run: echo "Staging remote deploy skipped (secrets not configured). Test/build still passed."
