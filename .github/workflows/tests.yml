name: Django Tests & Coverage

on:
  push:
    branches: [ main, develop, nephele ]
  pull_request:
    branches: [ main, develop, nephele ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: |
          requirements-ci.txt
          nephele/requirements-test.txt

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-ci.txt
        pip install -r nephele/requirements-test.txt

    - name: Django system check
      env:
        DJANGO_SETTINGS_MODULE: config.test_settings
        SECRET_KEY: test-secret-key-for-ci
        DEBUG: 'True'
      run: |
        cd nephele
        python manage.py check

    - name: Run linting
      continue-on-error: true
      run: |
        flake8 nephele --max-line-length=100 --exclude=migrations,__pycache__,.venv,staticfiles,htmlcov
        pylint nephele --disable=all --enable=E,F --exit-zero || true

    - name: Run tests with coverage
      env:
        DJANGO_SETTINGS_MODULE: config.test_settings
        SECRET_KEY: test-secret-key-for-ci
        DEBUG: 'True'
      run: |
        cd nephele
        # Playwright browser e2e is the dedicated `e2e` job (needs live stack).
        pytest -m "not e2e" --cov=. --cov-report=xml --cov-report=term-missing --junitxml=test-results.xml -v --tb=short

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      with:
        file: ./nephele/coverage.xml
        fail_ci_if_error: false
        verbose: true

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          nephele/test-results.xml
          nephele/coverage.xml
        if-no-files-found: ignore

    - name: Upload coverage artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: nephele/htmlcov/
        if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    needs: test
    if: success()
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: |
          requirements-ci.txt
          nephele/requirements-test.txt
          nephele/requirements-e2e.txt

    - name: Install Python test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-ci.txt
        pip install -r nephele/requirements-test.txt
        pip install -r nephele/requirements-e2e.txt

    - name: Install Playwright Chromium (+ OS deps)
      run: python -m playwright install --with-deps chromium

    - name: Start app stack (API + frontend)
      run: |
        if [[ ! -f .env ]]; then cp .env.example .env; fi
        docker compose up -d --build postgres redis django frontend
        echo "Waiting for API..."
        for i in $(seq 1 90); do
          if curl -fsS http://localhost:8000/api/v1/schema/ >/dev/null 2>&1 \
            || curl -fsS http://localhost:8000/ >/dev/null 2>&1; then
            echo "API is up"
            break
          fi
          if [[ "$i" -eq 90 ]]; then
            echo "API failed to become ready"
            docker compose ps
            docker compose logs --no-color django postgres | tail -300
            exit 1
          fi
          sleep 5
        done
        echo "Waiting for frontend..."
        for i in $(seq 1 90); do
          if curl -fsS http://localhost:3000/ >/dev/null 2>&1; then
            echo "Frontend is up"
            break
          fi
          if [[ "$i" -eq 90 ]]; then
            echo "Frontend failed to become ready"
            docker compose ps
            docker compose logs --no-color frontend | tail -300
            exit 1
          fi
          sleep 5
        done
        # Ensure bootstrap admin can authenticate (entrypoint creates it).
        for i in $(seq 1 30); do
          code=$(curl -sS -o /tmp/login.json -w '%{http_code}' \
            -X POST http://localhost:8000/api/v1/auth/login/ \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin123"}' || true)
          if [[ "$code" == "200" ]]; then
            echo "Admin login OK"
            break
          fi
          if [[ "$i" -eq 30 ]]; then
            echo "Admin login failed (HTTP $code)"
            cat /tmp/login.json || true
            docker compose logs --no-color django | tail -100
            exit 1
          fi
          sleep 2
        done

    - name: Run Playwright e2e tests
      env:
        E2E_FRONTEND_URL: http://localhost:3000
        E2E_API_URL: http://localhost:8000
        DJANGO_SUPERUSER_USERNAME: admin
        DJANGO_SUPERUSER_PASSWORD: admin123
        DJANGO_SETTINGS_MODULE: config.test_settings
        SECRET_KEY: test-secret-key-for-ci
      run: |
        cd nephele
        pytest tests/e2e/ -v --tb=short -m e2e --junitxml=e2e-results.xml

    - name: Upload e2e results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-test-results
        path: nephele/e2e-results.xml
        if-no-files-found: ignore

    - name: Stop app stack
      if: always()
      run: docker compose down -v || true

  performance:
    runs-on: ubuntu-latest
    needs: test
    if: success()

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: |
          requirements-ci.txt
          nephele/requirements-test.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-ci.txt
        pip install -r nephele/requirements-test.txt

    - name: Run performance tests
      continue-on-error: true
      env:
        DJANGO_SETTINGS_MODULE: config.test_settings
        SECRET_KEY: test-secret-key-for-ci
      run: |
        cd nephele
        pytest tests/test_performance.py -v --tb=short

  security:
    runs-on: ubuntu-latest
    needs: test
    if: success()

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit

    - name: Run Bandit security checks
      continue-on-error: true
      run: |
        bandit -r nephele -ll -f json -o bandit-report.json || true

    - name: Upload security reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: bandit-report.json
        if-no-files-found: ignore

  integration:
    runs-on: ubuntu-latest
    needs: test
    if: success()

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: |
          requirements-ci.txt
          nephele/requirements-test.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-ci.txt
        pip install -r nephele/requirements-test.txt

    - name: Run integration tests only
      env:
        DJANGO_SETTINGS_MODULE: config.test_settings
        SECRET_KEY: test-secret-key-for-ci
      run: |
        cd nephele
        pytest tests/integration/ -v --tb=short --junitxml=test-results.xml

    - name: Upload integration test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: integration-test-results
        path: nephele/test-results.xml
        if-no-files-found: ignore
