name: Django Tests & Coverage

on:
  push:
    branches: [ main, develop, nephele ]
  pull_request:
    branches: [ main, develop, nephele ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: |
          requirements-ci.txt
          nephele/requirements-test.txt

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-ci.txt
        pip install -r nephele/requirements-test.txt

    - name: Django system check
      env:
        DJANGO_SETTINGS_MODULE: config.test_settings
        SECRET_KEY: test-secret-key-for-ci
        DEBUG: 'True'
      run: |
        cd nephele
        python manage.py check

    - name: Run linting
      continue-on-error: true
      run: |
        flake8 nephele --max-line-length=100 --exclude=migrations,__pycache__,.venv,staticfiles,htmlcov
        pylint nephele --disable=all --enable=E,F --exit-zero || true

    - name: Run tests with coverage
      env:
        DJANGO_SETTINGS_MODULE: config.test_settings
        SECRET_KEY: test-secret-key-for-ci
        DEBUG: 'True'
      run: |
        cd nephele
        pytest --cov=. --cov-report=xml --cov-report=term-missing --junitxml=test-results.xml -v --tb=short

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      with:
        file: ./nephele/coverage.xml
        fail_ci_if_error: false
        verbose: true

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          nephele/test-results.xml
          nephele/coverage.xml
        if-no-files-found: ignore

    - name: Upload coverage artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: nephele/htmlcov/
        if-no-files-found: ignore

  performance:
    runs-on: ubuntu-latest
    needs: test
    if: success()

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: |
          requirements-ci.txt
          nephele/requirements-test.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-ci.txt
        pip install -r nephele/requirements-test.txt

    - name: Run performance tests
      continue-on-error: true
      env:
        DJANGO_SETTINGS_MODULE: config.test_settings
        SECRET_KEY: test-secret-key-for-ci
      run: |
        cd nephele
        pytest tests/test_performance.py -v --tb=short

  security:
    runs-on: ubuntu-latest
    needs: test
    if: success()

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit

    - name: Run Bandit security checks
      continue-on-error: true
      run: |
        bandit -r nephele -ll -f json -o bandit-report.json || true

    - name: Upload security reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: bandit-report.json
        if-no-files-found: ignore

  integration:
    runs-on: ubuntu-latest
    needs: test
    if: success()

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: |
          requirements-ci.txt
          nephele/requirements-test.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-ci.txt
        pip install -r nephele/requirements-test.txt

    - name: Run integration tests only
      env:
        DJANGO_SETTINGS_MODULE: config.test_settings
        SECRET_KEY: test-secret-key-for-ci
      run: |
        cd nephele
        pytest tests/integration/ -v --tb=short --junitxml=test-results.xml

    - name: Upload integration test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: integration-test-results
        path: nephele/test-results.xml
        if-no-files-found: ignore
