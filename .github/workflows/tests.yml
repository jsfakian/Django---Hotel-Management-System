name: Django Tests & Coverage

on:
  push:
    branches: [ main, develop, nephele ]
  pull_request:
    branches: [ main, develop, nephele ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: test_hms
          POSTGRES_USER: hms
          POSTGRES_PASSWORD: hms_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r HMS/requirements-test.txt
    
    - name: Set up Django settings
      env:
        DJANGO_SETTINGS_MODULE: HMS.settings
        DATABASE_URL: postgresql://hms:hms_password@localhost:5432/test_hms
        SECRET_KEY: test-secret-key-for-ci
        ALLOWED_HOSTS: localhost,127.0.0.1
        DEBUG: 'False'
      run: |
        export DJANGO_SETTINGS_MODULE=HMS.settings
        cd HMS
        python manage.py migrate
    
    - name: Run linting
      continue-on-error: true
      run: |
        flake8 HMS --max-line-length=100 --exclude=migrations,__pycache__,.venv
        pylint HMS --disable=all --enable=E,F --exit-zero || true
    
    - name: Run tests with coverage
      env:
        DJANGO_SETTINGS_MODULE: HMS.settings
        DATABASE_URL: postgresql://hms:hms_password@localhost:5432/test_hms
        SECRET_KEY: test-secret-key-for-ci
        ALLOWED_HOSTS: localhost,127.0.0.1
      run: |
        cd HMS
        pytest --cov=. --cov-report=xml --cov-report=html --junitxml=test-results.xml -v
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      with:
        file: ./HMS/coverage.xml
        fail_ci_if_error: false
        verbose: true
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.python-version }}
        path: HMS/test-results.xml
    
    - name: Upload coverage artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: HMS/htmlcov/

  performance:
    runs-on: ubuntu-latest
    needs: test
    if: success()
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r HMS/requirements-test.txt
    
    - name: Run performance tests
      continue-on-error: true
      env:
        DJANGO_SETTINGS_MODULE: HMS.settings
        SECRET_KEY: test-secret-key-for-ci
      run: |
        cd HMS
        pytest HMS/tests/test_performance.py -v --tb=short
    
    - name: Run load tests
      continue-on-error: true
      run: |
        pip install locust
        # locust tests would go here (requires running app)

  security:
    runs-on: ubuntu-latest
    needs: test
    if: success()
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
    
    - name: Run Bandit security checks
      continue-on-error: true
      run: |
        bandit -r HMS -ll -f json -o bandit-report.json || true
    
    - name: Check dependencies for vulnerabilities
      continue-on-error: true
      run: |
        safety check --json || true
    
    - name: Upload security reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          bandit-report.json

  integration:
    runs-on: ubuntu-latest
    needs: test
    if: success()
    
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: test_hms
          POSTGRES_USER: hms
          POSTGRES_PASSWORD: hms_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r HMS/requirements-test.txt
    
    - name: Run integration tests only
      env:
        DJANGO_SETTINGS_MODULE: HMS.settings
        DATABASE_URL: postgresql://hms:hms_password@localhost:5432/test_hms
        SECRET_KEY: test-secret-key-for-ci
      run: |
        cd HMS
        pytest HMS/tests/integration/ -v --tb=short
    
    - name: Upload integration test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: integration-test-results
        path: HMS/test-results.xml
