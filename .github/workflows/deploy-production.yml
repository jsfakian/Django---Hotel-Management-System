name: Deploy to Production

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: production
        type: choice
        options:
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # Test & Security Job: Run comprehensive tests
  # ============================================================================
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_hms
          POSTGRES_USER: hms
          POSTGRES_PASSWORD: hms_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r HMS/requirements-test.txt

    - name: Run Django checks (deployment mode)
      env:
        DJANGO_SETTINGS_MODULE: HMS.settings
        SECRET_KEY: test-secret-key
        DATABASE_URL: postgresql://hms:hms_password@localhost:5432/test_hms
        DEBUG: 'False'
        ALLOWED_HOSTS: production.example.com
      run: |
        cd HMS
        python manage.py check --deploy

    - name: Run full test suite with coverage
      env:
        DJANGO_SETTINGS_MODULE: HMS.settings
        SECRET_KEY: test-secret-key
        DATABASE_URL: postgresql://hms:hms_password@localhost:5432/test_hms
        DEBUG: 'False'
      run: |
        cd HMS
        pytest --cov=. --cov-report=xml --cov-report=term-missing:skip-covered -v
        # Check coverage threshold (80%)
        coverage report --fail-under=80

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./HMS/coverage.xml
        fail_ci_if_error: true

  # ============================================================================
  # Security Scanning
  # ============================================================================
  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install security tools
      run: |
        pip install bandit safety semgrep pip-audit

    - name: Run Bandit security scan
      run: |
        bandit -r HMS -f json -o bandit-report.json
        bandit -r HMS -f txt

    - name: Check dependencies for vulnerabilities
      run: |
        pip install -r requirements.txt
        pip-audit -r requirements.txt

    - name: Run Semgrep security checks
      run: |
        semgrep --config=p/security-audit HMS/ || true

    - name: SAST - Check for hardcoded secrets
      uses: truffleHQ/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: HEAD

  # ============================================================================
  # Build Job: Build Docker images for production
  # ============================================================================
  build:
    needs: [test, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          type=raw,value=production-latest

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile.prod
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Scan Docker image for vulnerabilities
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ steps.meta.outputs.tags }}
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  # ============================================================================
  # Pre-Production Checks
  # ============================================================================
  pre-deploy-checks:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Verify deployment configuration
      run: |
        echo "Checking production configuration..."
        
        # Verify required files exist
        files=("docker-compose.prod.yml" "Dockerfile.prod" ".env.prod.example" "deployment/nginx.conf")
        for file in "${files[@]}"; do
          if [ ! -f "$file" ]; then
            echo "✗ Missing required file: $file"
            exit 1
          fi
          echo "✓ Found: $file"
        done
        
        # Verify scripts are executable
        if [ -x "scripts/backup-database.sh" ] && [ -x "scripts/restore-database.sh" ]; then
          echo "✓ Backup scripts are executable"
        else
          echo "✗ Backup scripts not executable"
          exit 1
        fi
        
        echo "All pre-deployment checks passed!"

    - name: Check secrets are configured
      env:
        PROD_DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_KEY }}
        PROD_DEPLOY_HOST: ${{ secrets.PROD_DEPLOY_HOST }}
        PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
      run: |
        if [ -z "$PROD_DEPLOY_KEY" ] || [ -z "$PROD_DEPLOY_HOST" ] || [ -z "$PROD_ENV_FILE" ]; then
          echo "✗ Missing required GitHub secrets!"
          echo "Required secrets:"
          echo "  - PROD_DEPLOY_KEY: SSH private key for production server"
          echo "  - PROD_DEPLOY_HOST: Production server hostname"
          echo "  - PROD_ENV_FILE: Production .env.prod file contents"
          exit 1
        fi
        echo "✓ All required secrets are configured"

  # ============================================================================
  # Production Deployment
  # ============================================================================
  deploy:
    needs: [build, pre-deploy-checks]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://your-production-domain.com/health/
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v3

    - name: Create backup before deployment
      env:
        DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_KEY }}
        DEPLOY_HOST: ${{ secrets.PROD_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.PROD_DEPLOY_USER }}
        DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
      run: |
        mkdir -p ~/.ssh
        echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
        
        echo "Creating pre-deployment backup..."
        ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" << 'EOF'
        cd "$DEPLOY_PATH"
        ./scripts/backup-database.sh
        echo "Backup created successfully"
        EOF

    - name: Deploy to production
      env:
        DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_KEY }}
        DEPLOY_HOST: ${{ secrets.PROD_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.PROD_DEPLOY_USER }}
        DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
        ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
      run: |
        mkdir -p ~/.ssh
        echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
        
        # Deploy
        ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" << 'EOF'
        set -e
        cd "$DEPLOY_PATH"
        
        echo "=== Starting Production Deployment ==="
        
        # Update .env.prod
        echo "$ENV_FILE" > .env.prod
        
        # Pull latest code
        echo "Pulling latest code..."
        git fetch origin
        git checkout main
        git pull origin main
        
        # Pull latest Docker images
        echo "Pulling Docker images..."
        docker-compose -f docker-compose.prod.yml pull
        
        # Stop services gracefully
        echo "Stopping services..."
        docker-compose -f docker-compose.prod.yml down
        
        # Start services
        echo "Starting services..."
        docker-compose -f docker-compose.prod.yml up -d
        
        # Wait for services to stabilize
        sleep 30
        
        # Run migrations
        echo "Running database migrations..."
        docker-compose -f docker-compose.prod.yml exec -T django python manage.py migrate
        
        # Collect static files
        echo "Collecting static files..."
        docker-compose -f docker-compose.prod.yml exec -T django python manage.py collectstatic --noinput
        
        # Copy backups to secure location
        echo "Backing up database after deployment..."
        docker-compose -f docker-compose.prod.yml exec -T django python manage.py backup
        
        echo "=== Deployment Complete ==="
        EOF

    - name: Wait for services to stabilize
      run: |
        echo "Waiting for production services to stabilize (60 seconds)..."
        sleep 60

    - name: Run health checks
      run: |
        PROD_URL="https://your-production-domain.com"
        
        echo "Running health checks..."
        for i in {1..10}; do
          echo "Health check attempt $i/10..."
          
          if curl -sf "$PROD_URL/health/" > /dev/null; then
            echo "✓ Health check passed!"
            exit 0
          fi
          
          sleep 10
        done
        
        echo "✗ Health check failed after 100 seconds"
        exit 1

    - name: Run smoke tests
      run: |
        PROD_URL="https://your-production-domain.com"
        
        echo "Running smoke tests..."
        
        # Test main endpoints
        endpoints=(
          "/health/"
          "/admin/"
          "/api/v1/schema/"
        )
        
        for endpoint in "${endpoints[@]}"; do
          if curl -sf "$PROD_URL$endpoint" > /dev/null; then
            echo "✓ $endpoint is responding"
          else
            echo "✗ $endpoint is not responding"
            exit 1
          fi
        done

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          Production deployment successful!
          Commit: ${{ github.sha }}
          Timestamp: $(date)
        draft: false
        prerelease: false

    - name: Notify deployment success
      if: success()
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '✅ Production deployment successful!\n\nDeployed at: ' + new Date().toISOString()
          })

    - name: Notify deployment failure
      if: failure()
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '❌ Production deployment failed!\n\nPlease check the workflow logs at: ' + context.payload.pull_request.html_url
          })

    - name: Rollback on failure
      if: failure()
      env:
        DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_KEY }}
        DEPLOY_HOST: ${{ secrets.PROD_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.PROD_DEPLOY_USER }}
        DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
      run: |
        mkdir -p ~/.ssh
        echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
        
        echo "⚠️ Deployment failed! Rolling back..."
        ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" << 'EOF'
        cd "$DEPLOY_PATH"
        # Get last known good commit
        LAST_GOOD_COMMIT=$(git log --grep="deployment successful" -1 --format="%H" || git log -1 --format="%H")
        echo "Rolling back to: $LAST_GOOD_COMMIT"
        git checkout $LAST_GOOD_COMMIT
        docker-compose -f docker-compose.prod.yml down
        docker-compose -f docker-compose.prod.yml up -d
        echo "Rollback complete"
        EOF
