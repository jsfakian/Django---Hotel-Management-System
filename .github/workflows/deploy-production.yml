name: Deploy to Production

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  # Manual runs from any branch (including nephele) — deploy job allows workflow_dispatch.
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: production
        type: choice
        options:
          - production
      deploy_ref:
        description: 'Git ref to checkout on the server (branch or tag). Defaults to the workflow branch.'
        required: false
        type: string
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # Test & Security Job: Run comprehensive tests
  # ============================================================================
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_hms
          POSTGRES_USER: hms
          POSTGRES_PASSWORD: hms_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.14'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-ci.txt
        pip install -r nephele/requirements-test.txt

    - name: Run Django checks
      env:
        DJANGO_SETTINGS_MODULE: config.test_settings
        SECRET_KEY: test-secret-key
        DEBUG: 'True'
      run: |
        cd nephele
        python manage.py check

    - name: Run full test suite with coverage
      env:
        DJANGO_SETTINGS_MODULE: config.test_settings
        SECRET_KEY: test-secret-key
        DEBUG: 'True'
      run: |
        cd nephele
        # Gate on test pass; coverage is informational (full-tree % is far below unit-suite targets).
        pytest -m "not e2e" --cov=. --cov-report=xml --cov-report=term-missing:skip-covered -v
        coverage report || true

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./nephele/coverage.xml
        fail_ci_if_error: false

  # ============================================================================
  # Security Scanning
  # ============================================================================
  security:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.14'

    - name: Install security tools
      run: |
        pip install bandit safety semgrep pip-audit

    - name: Run Bandit security scan
      continue-on-error: true
      run: |
        bandit -r nephele -f json -o bandit-report.json || true
        bandit -r nephele -f txt || true

    - name: Check dependencies for vulnerabilities
      continue-on-error: true
      run: |
        pip install -r requirements.txt
        pip-audit -r requirements.txt || true

    - name: Run Semgrep security checks
      run: |
        semgrep --config=p/security-audit nephele/ || true

    - name: SAST - Check for hardcoded secrets
      continue-on-error: true
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: HEAD

  # ============================================================================
  # Build Job: Build Docker images for production
  # ============================================================================
  build:
    needs: [test, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          type=raw,value=production-latest

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile.prod
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Scan Docker image for vulnerabilities
      continue-on-error: true
      uses: aquasecurity/trivy-action@master
      with:
        # meta.outputs.tags is multiline — Trivy needs a single ref
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:production-latest
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v3
      if: always() && hashFiles('trivy-results.sarif') != ''
      with:
        sarif_file: 'trivy-results.sarif'

  # ============================================================================
  # Pre-Production Checks
  # ============================================================================
  pre-deploy-checks:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Verify deployment configuration
      run: |
        echo "Checking production configuration..."
        
        # Verify required files exist
        files=("docker-compose.prod.yml" "Dockerfile.prod" ".env.prod.example" "deployment/nginx.conf")
        for file in "${files[@]}"; do
          if [ ! -f "$file" ]; then
            echo "✗ Missing required file: $file"
            exit 1
          fi
          echo "✓ Found: $file"
        done
        
        # Verify scripts are executable
        if [ -x "scripts/backup-database.sh" ] && [ -x "scripts/restore-database.sh" ]; then
          echo "✓ Backup scripts are executable"
        else
          echo "✗ Backup scripts not executable"
          exit 1
        fi
        
        echo "All pre-deployment checks passed!"

    - name: Check secrets are configured
      env:
        # Prefer PROD_*; fall back to STAGING_* (same centaur host today).
        PROD_DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_KEY || secrets.STAGING_DEPLOY_KEY }}
        PROD_DEPLOY_HOST: ${{ secrets.PROD_DEPLOY_HOST || secrets.STAGING_DEPLOY_HOST }}
        PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
      run: |
        if [ -z "$PROD_DEPLOY_KEY" ] || [ -z "$PROD_DEPLOY_HOST" ]; then
          echo "✗ Missing deploy SSH secrets (PROD_* or STAGING_* fallback)!"
          echo "Required: PROD_DEPLOY_KEY/HOST (or STAGING_DEPLOY_KEY/HOST)"
          echo "Optional: PROD_ENV_FILE (keeps server .env.prod when unset)"
          exit 1
        fi
        if [ -z "$PROD_ENV_FILE" ]; then
          echo "ℹ PROD_ENV_FILE unset — deploy will keep the server's existing .env.prod"
        fi
        echo "✓ Deploy SSH secrets are configured"

  # ============================================================================
  # Production Deployment
  # ============================================================================
  deploy:
    needs: [build, pre-deploy-checks]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://your-production-domain.com/health/
    # Auto on main/tags; also when manually dispatched (so Actions UI "Run workflow" is not a no-op).
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')))

    steps:
    - uses: actions/checkout@v3

    - name: Resolve deploy ref
      id: ref
      run: |
        if [ -n "${{ github.event.inputs.deploy_ref }}" ]; then
          echo "name=${{ github.event.inputs.deploy_ref }}" >> "$GITHUB_OUTPUT"
        elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
        elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
          echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
        else
          echo "name=main" >> "$GITHUB_OUTPUT"
        fi

    - name: Create backup before deployment
      continue-on-error: true
      env:
        DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_KEY || secrets.STAGING_DEPLOY_KEY }}
        DEPLOY_HOST: ${{ secrets.PROD_DEPLOY_HOST || secrets.STAGING_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.PROD_DEPLOY_USER || secrets.STAGING_DEPLOY_USER }}
        DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH || secrets.STAGING_DEPLOY_PATH }}
        DEPLOY_PORT: ${{ secrets.PROD_DEPLOY_PORT || secrets.STAGING_DEPLOY_PORT }}
      run: |
        set -euo pipefail
        PORT="${DEPLOY_PORT:-58889}"
        mkdir -p ~/.ssh
        printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
        
        echo "Creating pre-deployment backup..."
        ssh -i ~/.ssh/deploy_key -p "$PORT" -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
          "DEPLOY_PATH=$(printf %q "$DEPLOY_PATH") bash -s" << 'EOF'
        set -euo pipefail
        cd "$DEPLOY_PATH"
        if [ -x ./scripts/backup-database.sh ]; then
          ./scripts/backup-database.sh
          echo "Backup created successfully"
        else
          echo "Backup script missing — skipping"
        fi
        EOF

    - name: Deploy to production
      env:
        DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_KEY || secrets.STAGING_DEPLOY_KEY }}
        DEPLOY_HOST: ${{ secrets.PROD_DEPLOY_HOST || secrets.STAGING_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.PROD_DEPLOY_USER || secrets.STAGING_DEPLOY_USER }}
        DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH || secrets.STAGING_DEPLOY_PATH }}
        DEPLOY_PORT: ${{ secrets.PROD_DEPLOY_PORT || secrets.STAGING_DEPLOY_PORT }}
        ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        DEPLOY_REF: ${{ steps.ref.outputs.name }}
      run: |
        set -euo pipefail
        PORT="${DEPLOY_PORT:-58889}"
        mkdir -p ~/.ssh
        printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

        if [ -n "${ENV_FILE:-}" ]; then
          # Ship .env.prod via scp (multiline secret — do not embed in remote argv)
          printf '%s\n' "$ENV_FILE" > /tmp/.env.prod
          scp -i ~/.ssh/deploy_key -P "$PORT" /tmp/.env.prod \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.env.prod"
          rm -f /tmp/.env.prod
        else
          echo "Keeping existing .env.prod on server (PROD_ENV_FILE not set)"
        fi

        ssh -i ~/.ssh/deploy_key -p "$PORT" -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
          "DEPLOY_PATH=$(printf %q "$DEPLOY_PATH") DEPLOY_REF=$(printf %q "$DEPLOY_REF") bash -s" << 'EOF'
        set -euo pipefail
        cd "$DEPLOY_PATH"

        echo "=== Starting Production Deployment (ref=$DEPLOY_REF) ==="

        echo "Pulling latest code..."
        git fetch --all --prune
        git checkout "$DEPLOY_REF"
        if git show-ref --verify --quiet "refs/remotes/jsfakian/$DEPLOY_REF"; then
          git reset --hard "jsfakian/$DEPLOY_REF"
        elif git rev-parse --verify --quiet "@{u}" >/dev/null; then
          git reset --hard "@{u}"
        else
          git pull --ff-only origin "$DEPLOY_REF" || git pull --ff-only
        fi

        COMPOSE="docker compose -f docker-compose.prod.yml --env-file .env.prod -p nephele"

        echo "Building Docker images from checkout..."
        $COMPOSE build django

        echo "Recreating services (project nephele — same stack as staging)..."
        $COMPOSE up -d --remove-orphans

        sleep 30

        echo "Running database migrations..."
        $COMPOSE exec -T django python manage.py migrate

        echo "Collecting static files..."
        $COMPOSE exec -T django python manage.py collectstatic --noinput

        echo "Backing up database after deployment..."
        $COMPOSE exec -T django python manage.py backup \
          || echo "Post-deploy backup skipped/failed (non-fatal)"

        echo "=== Deployment Complete ==="
        EOF

    - name: Wait for services to stabilize
      run: |
        echo "Waiting for production services to stabilize (60 seconds)..."
        sleep 60

    - name: Run health checks
      env:
        HEALTH_URL: ${{ secrets.PROD_HEALTH_URL || secrets.STAGING_HEALTH_URL }}
        DEPLOY_HOST: ${{ secrets.PROD_DEPLOY_HOST || secrets.STAGING_DEPLOY_HOST }}
      run: |
        set -euo pipefail
        HEALTH_URL="${HEALTH_URL:-https://${DEPLOY_HOST}/health/}"
        echo "Checking $HEALTH_URL"
        for i in {1..10}; do
          echo "Health check attempt $i/10..."
          if curl -skf "$HEALTH_URL" > /dev/null; then
            echo "✓ Health check passed!"
            exit 0
          fi
          sleep 10
        done
        echo "✗ Health check failed after 100 seconds"
        exit 1

    - name: Run smoke tests
      env:
        HEALTH_URL: ${{ secrets.PROD_HEALTH_URL || secrets.STAGING_HEALTH_URL }}
        DEPLOY_HOST: ${{ secrets.PROD_DEPLOY_HOST || secrets.STAGING_DEPLOY_HOST }}
      run: |
        set -euo pipefail
        BASE="${HEALTH_URL%/health/}"
        BASE="${BASE:-https://${DEPLOY_HOST}}"
        echo "Running smoke tests against $BASE"
        endpoints=("/health/" "/admin/" "/api/v1/schema/")
        for endpoint in "${endpoints[@]}"; do
          if curl -skf "$BASE$endpoint" > /dev/null; then
            echo "✓ $endpoint is responding"
          else
            echo "✗ $endpoint is not responding"
            exit 1
          fi
        done

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          Production deployment successful!
          Commit: ${{ github.sha }}
          Timestamp: $(date)
        draft: false
        prerelease: false

    - name: Notify deployment success
      if: success()
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '✅ Production deployment successful!\n\nDeployed at: ' + new Date().toISOString()
          })

    - name: Notify deployment failure
      if: failure()
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '❌ Production deployment failed!\n\nPlease check the workflow logs at: ' + context.payload.pull_request.html_url
          })

    - name: Rollback on failure
      if: failure()
      env:
        DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_KEY }}
        DEPLOY_HOST: ${{ secrets.PROD_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.PROD_DEPLOY_USER }}
        DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
        DEPLOY_PORT: ${{ secrets.PROD_DEPLOY_PORT }}
      run: |
        set -euo pipefail
        PORT="${DEPLOY_PORT:-58889}"
        mkdir -p ~/.ssh
        printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
        
        echo "⚠️ Deployment failed! Rolling back..."
        ssh -i ~/.ssh/deploy_key -p "$PORT" -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
          "DEPLOY_PATH=$(printf %q "$DEPLOY_PATH") bash -s" << 'EOF'
        set -euo pipefail
        cd "$DEPLOY_PATH"
        # Get last known good commit
        LAST_GOOD_COMMIT=$(git log --grep="deployment successful" -1 --format="%H" || git log -1 --format="%H")
        echo "Rolling back to: $LAST_GOOD_COMMIT"
        git checkout "$LAST_GOOD_COMMIT"
        docker compose -f docker-compose.prod.yml --env-file .env.prod -p nephele down
        docker compose -f docker-compose.prod.yml --env-file .env.prod -p nephele up -d
        echo "Rollback complete"
        EOF
