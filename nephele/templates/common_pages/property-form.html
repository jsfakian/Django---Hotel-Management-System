{% extends '../index.html' %}

{% block context %}
<div class="container py-4">
    <div class="card">
        <div class="card-body">
            <h3 class="mb-3">{{ title }}</h3>
            <form method="post">
                {% csrf_token %}
                <div class="form-row">
                    {% for field in form %}
                    <div class="form-group col-md-6">
                        <label>{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}<small class="text-danger">{{ field.errors|striptags }}</small>{% endif %}
                    </div>
                    {% endfor %}
                </div>
                <button class="btn btn-dark" type="submit">Save</button>
                {% if property %}
                <a class="btn btn-outline-secondary" href="{% url 'property-detail' property.pk %}">Cancel</a>
                {% else %}
                <a class="btn btn-outline-secondary" href="{% url 'properties-list' %}">Cancel</a>
                {% endif %}
            </form>
        </div>
    </div>
</div>
{% endblock %}
