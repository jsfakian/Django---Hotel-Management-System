{% extends '../index.html' %}

{% block context %}
<div class="container py-4">
    <div class="card border-danger">
        <div class="card-body">
            <h4 class="text-danger">Delete Property</h4>
            <p>You are about to delete <strong>{{ property.name }}</strong>. This action cannot be undone.</p>
            <form method="post">
                {% csrf_token %}
                <button class="btn btn-danger" type="submit">Confirm Delete</button>
                <a class="btn btn-outline-secondary" href="{% url 'property-detail' property.pk %}">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
