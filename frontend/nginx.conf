server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routing — edge nginx proxies /api to Django.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the shell; hashed assets under /assets/ are immutable.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
