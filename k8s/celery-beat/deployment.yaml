# Celery Beat must run as a single replica — multiple Beat instances
# would fire duplicate scheduled tasks.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: hms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      containers:
        - name: celery-beat
          image: hms-django:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - HMS
            - beat
            - -l
            - info
            - --scheduler
            - django_celery_beat.schedulers:DatabaseScheduler
          workingDir: /app/HMS
          envFrom:
            - configMapRef:
                name: hms-config
            - secretRef:
                name: hms-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
